name: tribunal
# Modo tribunal: defensor vs fiscal, el juez decide sobre pruebas, segundo modelo verifica.
# Se activa a mano sobre una tarea que YA tiene solución propuesta, o al comentar "/tribunal" en el Issue.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'ID de la tarea a juzgar (ej: TASK-0001)'
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  tribunal:
    # Corre si es dispatch manual, o si alguien comentó "/tribunal" en un Issue
    # (no en un PR: issue_comment también dispara ahí y github.event.issue.pull_request
    # solo existe cuando el comentario es de un PR).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/tribunal')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Resolver TASK_ID
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task_id=${{ github.event.inputs.task_id }}" >> $GITHUB_OUTPUT
          else
            # "/tribunal TASK-0001" -> extrae el segundo token
            TID=$(echo "${{ github.event.comment.body }}" | awk '{print $2}')
            echo "task_id=$TID" >> $GITHUB_OUTPUT
          fi

      - name: Celebrar juicio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TASK_ID: ${{ steps.t.outputs.task_id }}
        run: node src/tribunal.js

      - name: Guardar veredicto
        run: |
          git config user.name "tribunal"
          git config user.email "agent@bot.local"
          git add tasks/
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "tribunal: veredicto ${{ steps.t.outputs.task_id }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3 4; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rechazado (intento $i), sincronizando con origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { echo "conflicto al rebasar, aborto"; git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          echo "no se pudo publicar tras varios intentos"; exit 1

      - name: Publicar veredicto en el Issue
        if: ${{ github.event_name == 'issue_comment' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh issue comment ${{ github.event.issue.number }} --body-file tribunal_output.md
