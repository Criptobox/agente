name: agent-run
on:
  workflow_dispatch:
    inputs:
      agent:   { description: "agente a ejecutar", required: true }
      task_id: { description: "id de la tarea (TASK-XXXX)", required: true }
      issue:   { description: "número del issue para comentar (opcional)", required: false }

permissions:
  contents: write     # escribir memoria y hacer commit
  issues:   write     # comentar el handoff en el issue

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Resolver proyecto de la tarea
        id: proj
        env: { TASK_ID: "${{ inputs.task_id }}" }
        run: node src/resolve-project.js

      - name: Checkout del código del proyecto (./target, solo lectura)
        if: ${{ steps.proj.outputs.repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.proj.outputs.repo }}
          path: target

      - name: Ejecutar agente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT:   ${{ inputs.agent }}
          TASK_ID: ${{ inputs.task_id }}
          # Si hubo checkout del proyecto, esto habilita las tools de lectura
          # de código y de test real (github.read_file, testing.run).
          PROJECT_DIR: target
          PROJECT_META_FILE: ${{ steps.proj.outputs.meta_file }}
          # Opcionales (fallback). Deja vacíos si no los usas:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/runner.js

      - name: Comentar handoff en el issue
        if: ${{ inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ inputs.issue }}" --body-file agent_output.md

      - name: Guardar memoria en git
        run: |
          git config user.name  "agent-${{ inputs.agent }}"
          git config user.email "agent@bot.local"
          git add memory/ tasks/
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "mem: ${{ inputs.task_id }} por ${{ inputs.agent }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3 4; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rechazado (intento $i), sincronizando con origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { echo "conflicto al rebasar, aborto"; git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          echo "no se pudo publicar tras varios intentos"; exit 1
