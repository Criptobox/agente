name: sandbox-breaker
# Levanta una COPIA de tu web dentro del runner y corre el Breaker contra ella.
# NUNCA toca producción. Firebase debe apuntar a un proyecto de PRUEBA.
on:
  workflow_dispatch:
    inputs:
      repo:    { description: "repo del proyecto a probar (ej: Criptobox/TiendaMax)", required: true }
      task_id: { description: "id de la tarea", required: true }
      issue:   { description: "número del issue (opcional)", required: false }

permissions:
  contents: write
  issues:   write

jobs:
  break:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del cerebro
        uses: actions/checkout@v4

      - name: Checkout del proyecto a probar (en ./target)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          path: target

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Servir la web estática (copia efímera)
        run: |
          npx --yes http-server ./target -p 8080 &
          sleep 3
          curl -s -o /dev/null -w "sandbox arriba: %{http_code}\n" http://localhost:8080 || true

      - name: Correr el Breaker contra la copia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: breaker
          TASK_ID: ${{ inputs.task_id }}
          SANDBOX_URL: http://localhost:8080
          PROJECT_DIR: target
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node src/runner.js

      - name: Comentar resultado
        if: ${{ inputs.issue != '' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh issue comment "${{ inputs.issue }}" --body-file agent_output.md

      - name: Guardar hallazgos en git
        run: |
          git config user.name  "agent-breaker"
          git config user.email "agent@bot.local"
          git add memory/ tasks/
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "breaker: ${{ inputs.task_id }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3 4; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rechazado (intento $i), sincronizando con origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { echo "conflicto al rebasar, aborto"; git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          echo "no se pudo publicar tras varios intentos"; exit 1
