name: orchestrator
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues:   write

jobs:
  plan:
    # Solo actúa si el issue lleva la etiqueta "agent"
    if: contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Crear tarea desde el issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_NUM:   ${{ github.event.issue.number }}
        run: node src/orchestrate.js
      - name: Commit tarea
        run: |
          git config user.name  "orchestrator"
          git config user.email "agent@bot.local"
          git add tasks/
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "task: nueva desde issue #${{ github.event.issue.number }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3 4; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rechazado (intento $i), sincronizando con origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { echo "conflicto al rebasar, aborto"; git rebase --abort; exit 1; }
            sleep $((i * 2))
          done
          echo "no se pudo publicar tras varios intentos"; exit 1
      - name: Confirmar en el issue
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh issue comment "${{ github.event.issue.number }}" --body-file orch_output.md
