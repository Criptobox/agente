name: pages
# Publica la app (carpeta dashboard/) en GitHub Pages automáticamente.
# Se ejecuta solo en cada push que toque el dashboard, o a mano.
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Permisos que exige el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llegan varios, se queda el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la app (solo la carpeta dashboard)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Desplegar
        id: deploy
        uses: actions/deploy-pages@v4
